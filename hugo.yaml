baseURL: "https://cj-sfsm.github.io/ClubJeune-SFSM/"
theme: hugobricks
defaultContentLanguage: fr
defaultContentLanguageInSubdir: false
assetDir: static

disableKinds:
  - taxonomy
  - term

relativeURLs: true
canonifyURLs: true

params:
  abstractSubmission:
    endpoint: "https://script.google.com/macros/s/AKfycbxJqSK__F8Yl0lx9nxD0EuVZbmToeaqZTKfBFP7rSwPhQlavHyZh86SgnrqNQHEBuJUoQ/exec"
    turnstileSiteKey: ""

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true

languages:
  fr:
    languageName: Français
    contentDir: content/fr
    weight: 1
    disabled: false
    permalinks:
      page:
        posts: /blog/:slug
        services: /services/:slug
        products: /webshop/:slug
      section:
        posts: /blog/
        services: /services/
        products: /webshop/

  en:
    languageName: English
    contentDir: content/en
    weight: 2
    disabled: false
    permalinks:
      page:
        posts: /blog/:slug
        services: /services/:slug
        products: /webshop/:slug
      section:
        posts: /blog/
        services: /services/
        products: /webshop/

